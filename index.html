<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NFT Escrow</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #ffffff);
    --text: var(--tg-theme-text-color, #1a1a1a);
    --hint: var(--tg-theme-hint-color, #8e8e93);
    --link: var(--tg-theme-link-color, #2481cc);
    --btn: var(--tg-theme-button-color, #2481cc);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --sec-bg: var(--tg-theme-secondary-bg-color, #f2f2f7);
    --nav-bg: var(--tg-theme-secondary-bg-color, #ffffff);
    --danger: #ff3b30;
    --success: #34c759;
    --warn: #ff9500;
    --gold: #ffb400;
    --radius: 16px;
    --radius-sm: 12px;
    --shadow: 0 2px 12px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 28px rgba(0,0,0,0.12);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; margin: 0; padding: 0; }
  html, body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
    font-size: 15px; line-height: 1.4;
    min-height: 100vh; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  body { padding-bottom: calc(78px + env(safe-area-inset-bottom)); }
  .app { max-width: 500px; margin: 0 auto; padding: 0 16px; }
  .app.standalone { padding-bottom: 16px; }

  /* ---------- TOP HEADER ---------- */
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 0 18px;
    position: sticky; top: 0; z-index: 20;
    background: var(--bg);
  }
  .topbar .title { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; }
  .topbar .title small { display: block; font-size: 12px; font-weight: 500; color: var(--hint); letter-spacing: 0; margin-top: 2px; }
  .topbar-avatar {
    width: 42px; height: 42px; border-radius: 50%; flex-shrink: 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 17px;
    box-shadow: 0 3px 12px rgba(102,126,234,0.35);
  }
  .topbar .spacer { flex: 1; }
  .icon-btn {
    width: 42px; height: 42px; border-radius: 50%;
    background: var(--sec-bg); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--text); transition: transform 0.1s;
  }
  .icon-btn:active { transform: scale(0.92); }

  .back-btn {
    width: 40px; height: 40px; border-radius: 12px;
    background: var(--sec-bg); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--text); flex-shrink: 0;
  }
  .back-btn:active { transform: scale(0.92); }

  /* ---------- CARDS ---------- */
  .card {
    background: var(--sec-bg);
    border-radius: var(--radius);
    padding: 16px;
    margin-bottom: 12px;
  }

  /* Balance card - big gradient */
  .balance-card {
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    border-radius: 20px; padding: 20px;
    color: #fff; margin-bottom: 14px;
    position: relative; overflow: hidden;
    box-shadow: 0 8px 28px rgba(102,126,234,0.35);
  }
  .balance-card::before {
    content: ''; position: absolute; top: -50%; right: -20%;
    width: 220px; height: 220px; border-radius: 50%;
    background: rgba(255,255,255,0.08);
  }
  .balance-card::after {
    content: ''; position: absolute; bottom: -60%; left: -20%;
    width: 180px; height: 180px; border-radius: 50%;
    background: rgba(255,255,255,0.06);
  }
  .balance-label { font-size: 13px; opacity: 0.85; font-weight: 500; margin-bottom: 6px; position: relative; z-index: 1; }
  .balance-value { font-size: 32px; font-weight: 800; letter-spacing: -1px; position: relative; z-index: 1; margin-bottom: 16px; }
  .balance-value small { font-size: 18px; opacity: 0.8; font-weight: 600; }
  .balance-actions { display: flex; gap: 8px; position: relative; z-index: 1; }
  .balance-actions button {
    flex: 1; padding: 11px; border-radius: 12px; border: none;
    background: rgba(255,255,255,0.2); color: #fff;
    font-size: 14px; font-weight: 600; cursor: pointer;
    backdrop-filter: blur(8px); transition: transform 0.1s;
    font-family: inherit;
  }
  .balance-actions button:active { transform: scale(0.96); background: rgba(255,255,255,0.3); }

  /* Trust badge */
  .trust-banner {
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(135deg, rgba(52,199,89,0.12), rgba(52,199,89,0.06));
    border: 1px solid rgba(52,199,89,0.25);
    border-radius: var(--radius-sm);
    padding: 12px 14px; margin-bottom: 14px;
  }
  .trust-banner .icon { font-size: 22px; }
  .trust-banner .text { font-size: 13px; color: var(--text); line-height: 1.35; }
  .trust-banner .text b { color: var(--success); }

  /* Quick actions grid */
  .quick-grid {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 10px; margin-bottom: 16px;
  }
  .quick-card {
    background: var(--sec-bg); border: none; border-radius: var(--radius);
    padding: 16px; cursor: pointer; text-align: left;
    font-family: inherit; color: var(--text);
    transition: transform 0.1s, background 0.15s;
    display: flex; flex-direction: column; gap: 10px;
  }
  .quick-card:active { transform: scale(0.97); }
  .quick-card .q-icon {
    width: 42px; height: 42px; border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .quick-card .q-title { font-size: 15px; font-weight: 600; }
  .quick-card .q-sub { font-size: 12px; color: var(--hint); }

  /* ---------- SECTION ---------- */
  .section-title {
    font-size: 17px; font-weight: 700;
    margin: 20px 0 10px; letter-spacing: -0.3px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .section-title .link { font-size: 13px; color: var(--link); font-weight: 600; cursor: pointer; background: none; border: none; font-family: inherit; }

  /* ---------- ITEM ---------- */
  .item {
    background: var(--sec-bg); border-radius: var(--radius-sm);
    padding: 14px; margin-bottom: 8px;
    transition: transform 0.1s;
  }
  .item.clickable { cursor: pointer; }
  .item.clickable:active { transform: scale(0.98); }
  .item-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
  .item-sub { font-size: 13px; color: var(--hint); }
  .item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
  .item-row:last-child { margin-bottom: 0; }
  .item-label { color: var(--hint); font-size: 13px; }
  .item-value { font-weight: 600; font-size: 14px; word-break: break-all; text-align: right; }
  .item-value.mono { font-family: 'SF Mono', Menlo, monospace; font-size: 13px; }

  /* ---------- STATUS PILLS ---------- */
  .pill {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 600;
  }
  .pill.waiting { background: rgba(255,149,0,0.15); color: var(--warn); }
  .pill.pending { background: rgba(255,149,0,0.15); color: var(--warn); }
  .pill.active { background: rgba(36,129,204,0.15); color: var(--link); }
  .pill.completed { background: rgba(52,199,89,0.15); color: var(--success); }
  .pill.cancelled { background: rgba(142,142,147,0.15); color: var(--hint); }
  .pill.rejected { background: rgba(255,59,48,0.15); color: var(--danger); }

  /* ---------- BUTTONS ---------- */
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    width: 100%; padding: 15px;
    border: none; border-radius: var(--radius-sm);
    font-size: 15px; font-weight: 600;
    cursor: pointer; transition: transform 0.1s, opacity 0.15s;
    font-family: inherit;
  }
  .btn:active { transform: scale(0.98); }
  .btn-primary { background: var(--btn); color: var(--btn-text); }
  .btn-secondary { background: var(--sec-bg); color: var(--text); }
  .btn-danger { background: rgba(255,59,48,0.12); color: var(--danger); }
  .btn-success { background: rgba(52,199,89,0.12); color: var(--success); }
  .btn-gold { background: linear-gradient(135deg, #ffb400, #ff8800); color: #fff; }
  .btn + .btn { margin-top: 8px; }
  .btn-row { display: flex; gap: 8px; }
  .btn-row .btn { margin-top: 0; flex: 1; }

  /* ---------- INPUTS ---------- */
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: var(--hint); margin-bottom: 6px; font-weight: 600; }
  .input, textarea {
    width: 100%; padding: 14px 16px;
    background: var(--sec-bg); border: 2px solid transparent;
    border-radius: var(--radius-sm); color: var(--text);
    font-size: 16px; font-family: inherit; outline: none;
    transition: border-color 0.15s, background 0.15s;
  }
  .input:focus, textarea:focus {
    border-color: var(--btn);
    background: var(--bg);
  }
  textarea { resize: vertical; min-height: 90px; }

  /* ---------- PROFILE ---------- */
  .profile-hero {
    text-align: center; padding: 24px 16px 16px;
  }
  .avatar-xl {
    width: 88px; height: 88px; border-radius: 50%;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 34px;
    margin: 0 auto 14px;
    box-shadow: 0 8px 24px rgba(102,126,234,0.35);
    position: relative;
  }
  .avatar-xl .status-dot {
    position: absolute; bottom: 4px; right: 4px;
    width: 20px; height: 20px; border-radius: 50%;
    background: var(--success); border: 3px solid var(--bg);
  }
  .profile-name { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; margin-bottom: 6px; }
  .badges { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 10px; }
  .badge-chip {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 4px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 700;
    letter-spacing: 0.3px;
  }
  .badge-premium {
    background: linear-gradient(135deg, #ffb400, #ff8800);
    color: #fff;
  }
  .badge-verified {
    background: rgba(36,129,204,0.15); color: var(--link);
  }
  .badge-admin {
    background: linear-gradient(135deg, #ff3b30, #ff9500);
    color: #fff;
  }
  .profile-id {
    font-size: 12px; color: var(--hint);
    font-family: 'SF Mono', Menlo, monospace;
    padding: 4px 10px; background: var(--sec-bg);
    border-radius: 8px; display: inline-block;
  }

  /* Level card */
  .level-card {
    background: var(--sec-bg); border-radius: var(--radius);
    padding: 16px; margin-bottom: 12px;
  }
  .level-head {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 10px;
  }
  .level-name { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 700; }
  .level-name .icon { font-size: 24px; }
  .level-count { font-size: 12px; color: var(--hint); font-weight: 600; }
  .progress {
    height: 8px; background: rgba(142,142,147,0.2);
    border-radius: 100px; overflow: hidden; position: relative;
  }
  .progress-bar {
    height: 100%; border-radius: 100px;
    background: linear-gradient(90deg, #667eea, #764ba2);
    transition: width 0.4s ease;
  }
  .progress-hint { font-size: 12px; color: var(--hint); margin-top: 8px; text-align: center; }

  /* Stats grid */
  .stats-grid {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 8px; margin-bottom: 12px;
  }
  .stat-box {
    background: var(--sec-bg); border-radius: var(--radius-sm);
    padding: 14px 8px; text-align: center;
  }
  .stat-box .val { font-size: 20px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 2px; }
  .stat-box .lbl { font-size: 11px; color: var(--hint); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; }
  .stat-box .val.gold { color: var(--gold); }

  /* ---------- TRADE ITEM ---------- */
  .trade-item {
    background: var(--sec-bg); border-radius: var(--radius-sm);
    padding: 14px; margin-bottom: 10px; cursor: pointer;
    transition: transform 0.1s;
    position: relative; overflow: hidden;
  }
  .trade-item:active { transform: scale(0.98); }
  .trade-item .head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
  .trade-item .id { font-size: 12px; color: var(--hint); font-weight: 600; font-family: 'SF Mono', Menlo, monospace; }
  .trade-item .nft { font-size: 14px; font-weight: 600; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trade-item .foot { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--hint); }
  .trade-item .amount { font-weight: 700; color: var(--text); font-size: 15px; }

  /* ---------- BOTTOM NAV ---------- */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--bg);
    border-top: 1px solid rgba(142,142,147,0.15);
    display: flex; justify-content: space-around;
    padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
    z-index: 100;
    backdrop-filter: blur(20px);
  }
  .nav-btn {
    background: none; border: none; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 6px 16px; border-radius: 12px;
    color: var(--hint); font-family: inherit;
    transition: color 0.15s, transform 0.1s;
    position: relative;
    flex: 1; max-width: 90px;
  }
  .nav-btn:active { transform: scale(0.92); }
  .nav-btn .n-icon { font-size: 22px; line-height: 1; }
  .nav-btn .n-label { font-size: 10px; font-weight: 600; }
  .nav-btn.active { color: var(--btn); }
  .nav-btn.active .n-icon { transform: translateY(-1px); }
  .nav-btn .n-badge {
    position: absolute; top: 0; right: calc(50% - 20px);
    background: var(--danger); color: #fff;
    font-size: 10px; font-weight: 700;
    min-width: 16px; height: 16px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    padding: 0 4px;
  }

  /* ---------- EMPTY ---------- */
  .empty {
    text-align: center; padding: 48px 20px;
    color: var(--hint);
  }
  .empty .icon { font-size: 52px; margin-bottom: 12px; opacity: 0.5; }
  .empty .title { font-size: 16px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
  .empty .desc { font-size: 13px; }

  /* ---------- TOAST ---------- */
  .toast {
    position: fixed; bottom: calc(90px + env(safe-area-inset-bottom));
    left: 50%; transform: translateX(-50%) translateY(20px);
    background: rgba(30,30,30,0.92); color: #fff;
    padding: 12px 20px; border-radius: 24px;
    font-size: 14px; font-weight: 500;
    transition: transform 0.25s, opacity 0.25s;
    z-index: 9999; max-width: calc(100vw - 32px);
    text-align: center; opacity: 0; pointer-events: none;
    backdrop-filter: blur(10px);
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  /* ---------- MODAL ---------- */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,0.55);
    display: none; align-items: flex-end; justify-content: center;
    z-index: 1000; backdrop-filter: blur(4px);
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--bg); border-radius: 24px 24px 0 0;
    padding: 20px 20px calc(20px + env(safe-area-inset-bottom));
    width: 100%; max-width: 500px;
    animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    max-height: 90vh; overflow-y: auto;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-grabber {
    width: 40px; height: 4px; border-radius: 2px;
    background: rgba(142,142,147,0.3);
    margin: 0 auto 16px;
  }
  .modal h3 { margin-bottom: 16px; font-size: 20px; font-weight: 800; letter-spacing: -0.3px; }

  /* ---------- STAR RATING ---------- */
  .rating-stars { display: flex; justify-content: center; gap: 8px; margin: 20px 0; }
  .rating-stars button {
    background: none; border: none; cursor: pointer;
    font-size: 42px; padding: 4px; line-height: 1;
    opacity: 0.25; transition: opacity 0.15s, transform 0.15s;
    filter: grayscale(1);
  }
  .rating-stars button.active { opacity: 1; transform: scale(1.12); filter: grayscale(0); }
  .rating-stars button:active { transform: scale(0.9); }

  /* ---------- SCREEN ---------- */
  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn 0.22s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  /* ---------- COPY ---------- */
  .copy-inline {
    background: none; border: none; cursor: pointer;
    color: var(--link); font-size: 12px; font-weight: 700;
    font-family: inherit; padding: 4px 8px;
  }

  /* Code block for wallet address */
  .addr-box {
    display: flex; align-items: center; justify-content: space-between;
    background: var(--bg); padding: 12px 14px; border-radius: 12px;
    margin-top: 8px; gap: 8px;
    border: 1px dashed rgba(142,142,147,0.3);
  }
  .addr-box code {
    font-family: 'SF Mono', Menlo, monospace;
    font-size: 13px; word-break: break-all; flex: 1;
  }

  /* ---------- SKELETON pulse for balance ---------- */
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
</style>
</head>
<body>
<div class="app" id="app"></div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modal-overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal" id="modal"></div>
</div>

<script>
/* ============================================================
   TELEGRAM INIT
   ============================================================ */
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
  tg.setHeaderColor('bg_color');
  tg.setBackgroundColor('bg_color');
  if (tg.enableClosingConfirmation) tg.enableClosingConfirmation();
}

/* ============================================================
   CONFIG
   ============================================================ */
const CONFIG = {
  ADMIN_WALLET: '2204120133486338',
  SUPPORT: '@GiftGuaranted',
  MAIN_ADMIN_ID: '8295645690',
  STORAGE_KEY: 'nft_escrow_v2'
};

/* ============================================================
   STATE
   ============================================================ */
const STATE = {
  screen: 'main',
  params: {},
  tgUser: null,
  tab: 'main',
  data: {
    trades: {}, tradeCount: 0,
    userWallets: {}, userBalances: {}, userStats: {},
    pendingRatings: {}, pendingTopups: {},
    admins: [CONFIG.MAIN_ADMIN_ID]
  }
};

function loadData() {
  try {
    const raw = localStorage.getItem(CONFIG.STORAGE_KEY);
    if (raw) {
      const p = JSON.parse(raw);
      Object.assign(STATE.data, p);
      if (!STATE.data.admins.includes(CONFIG.MAIN_ADMIN_ID)) STATE.data.admins.push(CONFIG.MAIN_ADMIN_ID);
    }
  } catch(e) { console.error(e); }
}
function saveData() {
  try { localStorage.setItem(CONFIG.STORAGE_KEY, JSON.stringify(STATE.data)); }
  catch(e) { console.error(e); }
}

/* ============================================================
   USER HELPERS
   ============================================================ */
function getUserId() {
  if (STATE.tgUser) return String(STATE.tgUser.id);
  if (!localStorage.getItem('_test_uid')) localStorage.setItem('_test_uid', '100000001');
  return localStorage.getItem('_test_uid');
}
function getUserName() {
  if (STATE.tgUser) return STATE.tgUser.username || STATE.tgUser.first_name || 'user';
  return 'testuser';
}
function getUserFirst() {
  if (STATE.tgUser) return STATE.tgUser.first_name || STATE.tgUser.username || 'User';
  return 'User';
}
function getUserInitials() {
  const n = getUserFirst();
  return n.slice(0, 2).toUpperCase();
}
function isAdmin(uid = getUserId()) { return STATE.data.admins.includes(String(uid)); }
function isPremium() { return STATE.tgUser?.is_premium || false; }

function ensureUserStats(uid) {
  if (!STATE.data.userStats[uid]) {
    STATE.data.userStats[uid] = {
      completed_trades: 0, total_rating: 0, rating_count: 0,
      average_rating: 0.0, disputes: 0, first_seen: new Date().toISOString()
    };
    saveData();
  }
}

function getLevel(trades) {
  const levels = [
    { min: 100, name: 'Легенда',   icon: '👑', color: '#ff6b00', next: null },
    { min: 50,  name: 'Платина',   icon: '💎', color: '#00bfff', next: 100 },
    { min: 30,  name: 'Золото',    icon: '🥇', color: '#ffb400', next: 50 },
    { min: 15,  name: 'Серебро',   icon: '🥈', color: '#a0a0a0', next: 30 },
    { min: 5,   name: 'Бронза',    icon: '🥉', color: '#cd7f32', next: 15 },
    { min: 0,   name: 'Новичок',   icon: '🌱', color: '#34c759', next: 5 }
  ];
  return levels.find(l => trades >= l.min) || levels[levels.length - 1];
}

/* ============================================================
   UTILS
   ============================================================ */
function toast(msg, ms = 2200) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), ms);
}
function fmtMoney(n) { return Number(n).toLocaleString('ru-RU'); }
function fmtMoneyFull(n) { return fmtMoney(n) + ' ₽'; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function nowISO() { return new Date().toISOString(); }
function fmtDate(iso) {
  const d = new Date(iso);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return 'только что';
  if (diff < 3600) return Math.floor(diff/60) + ' мин назад';
  if (diff < 86400) return Math.floor(diff/3600) + ' ч назад';
  return d.toLocaleString('ru-RU', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
}
function copyText(text) {
  if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => toast('✅ Скопировано'));
  } else {
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); document.body.removeChild(ta);
    toast('✅ Скопировано');
  }
}
function openModal(html) {
  document.getElementById('modal').innerHTML = `<div class="modal-grabber"></div>` + html;
  document.getElementById('modal-overlay').classList.add('show');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
}

/* ============================================================
   NAVIGATION
   ============================================================ */
function go(screen, params = {}) {
  STATE.screen = screen;
  STATE.params = params;
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setTab(tab) {
  STATE.tab = tab;
  const map = { main: 'main', trades: 'my-trades', wallets: 'wallets', profile: 'profile' };
  go(map[tab] || 'main');
}

/* ============================================================
   BOTTOM NAV
   ============================================================ */
function renderNav() {
  const uid = getUserId();
  const pendingRatings = (STATE.data.pendingRatings[uid] || []).length;
  const myTrades = Object.values(STATE.data.trades)
    .filter(t => t.seller_id === uid || t.buyer_id === uid)
    .filter(t => ['waiting_payment','pending_verification','payment_confirmed','nft_sent'].includes(t.status)).length;

  const tabs = [
    { id: 'main',    icon: '🏠', label: 'Главная' },
    { id: 'trades',  icon: '📋', label: 'Сделки', badge: myTrades || null },
    { id: 'wallets', icon: '💼', label: 'Кошельки' },
    { id: 'profile', icon: '👤', label: 'Профиль', badge: pendingRatings || null }
  ];

  return `<nav class="bottom-nav">
    ${tabs.map(t => `
      <button class="nav-btn ${STATE.tab === t.id ? 'active' : ''}" onclick="setTab('${t.id}')">
        <span class="n-icon">${t.icon}</span>
        <span class="n-label">${t.label}</span>
        ${t.badge ? `<span class="n-badge">${t.badge > 9 ? '9+' : t.badge}</span>` : ''}
      </button>
    `).join('')}
  </nav>`;
}

    </div>

    <div class="field">

function submitCreateTrade() {
  const link = document.getElementById('nft-link').value.trim();
  const amount = parseFloat(document.getElementById('trade-amount').value);
  if (!link) return toast('❌ Введите описание NFT');
  if (!amount || amount < 100) return toast('❌ Минимальная сумма 100 ₽');

  const uid = getUserId();
  const tradeId = 'trade_' + STATE.data.tradeCount;
  STATE.data.tradeCount++;
  STATE.data.trades[tradeId] = {
    seller_id: uid,
    seller_username: getUserName(),
    nft_link: link,
    amount,
    status: 'waiting_buyer',
    created_at: nowISO(),
    buyer_id: null, buyer_username: null
  };
  saveData();
  toast('✅ Сделка создана');
  go('trade-view', { tradeId });
}

/* ============================================================
   SCREEN: TRADE VIEW
   ============================================================ */
function screenTradeView() {
  const tradeId = STATE.params.tradeId;
  const t = STATE.data.trades[tradeId];
  if (!t) return `<div class="empty"><div class="icon">❓</div><div class="title">Сделка не найдена</div></div>`;

  const uid = getUserId();
  const role = uid === t.seller_id ? 'seller' : (uid === t.buyer_id ? 'buyer' : 'viewer');
  const statusMap = {
    waiting_buyer: ['Ожидает покупателя', 'waiting', '⏳'],
    waiting_payment: ['Ожидает оплаты', 'pending', '💳'],
    pending_verification: ['Проверка оплаты', 'pending', '🔍'],
    payment_confirmed: ['Оплата подтверждена', 'active', '✅'],
    nft_sent: ['NFT передан', 'active', '📦'],
    completed: ['Завершена', 'completed', '🎉'],
    cancelled: ['Отменена', 'cancelled', '❌'],
    payment_rejected: ['Оплата отклонена', 'rejected', '❌']
  };
  const [sLabel, sClass, sIcon] = statusMap[t.status] || [t.status, 'waiting', '•'];
  const sellerStats = STATE.data.userStats[t.seller_id] || { average_rating: 0 };

  let actions = '';
  if (role === 'seller' && t.status === 'waiting_buyer') {
    const joinUrl = `${location.origin}${location.pathname}?trade=${tradeId}`;
    actions = `
      <div class="card">
        <div class="card-title" style="font-size:12px;color:var(--hint);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">🔗 Ссылка для покупателя</div>
        <div class="addr-box" style="margin-top:0;">
          <code>${esc(joinUrl)}</code>
          <button class="copy-inline" onclick="copyText('${joinUrl}')">Копировать</button>
        </div>
      </div>`;
  }
  if (role === 'viewer' && t.status === 'waiting_buyer') {
    actions = `<button class="btn btn-primary" onclick="joinAsBuyer('${tradeId}')">🤝 Присоединиться как покупатель</button>`;
  }
  if (role === 'buyer' && t.status === 'waiting_payment') {
    actions = `
      <div class="card">
        <div style="font-size:12px;color:var(--hint);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">💳 Реквизиты для оплаты</div>
        <div style="font-size:13px;color:var(--hint);margin-bottom:6px;">Переведите <b style="color:var(--text);">${fmtMoneyFull(t.amount)}</b> на счёт:</div>
        <div class="addr-box" style="margin-top:0;">
          <code>${CONFIG.ADMIN_WALLET}</code>
          <button class="copy-inline" onclick="copyText('${CONFIG.ADMIN_WALLET}')">Копировать</button>
        </div>
      </div>
      <button class="btn btn-primary" onclick="markPaid('${tradeId}')">✅ Я оплатил</button>
      <button class="btn btn-danger" onclick="cancelTrade('${tradeId}')">❌ Отменить</button>`;
  }
  if (role === 'seller' && t.status === 'payment_confirmed') {
    actions = `<button class="btn btn-primary" onclick="markNftSent('${tradeId}')">📦 Я передал NFT</button>`;
  }
  if (role === 'buyer' && t.status === 'nft_sent') {
    actions = `<button class="btn btn-success" onclick="markNftReceived('${tradeId}')">✅ Я получил NFT</button>`;
  }
  if (role === 'seller' && t.status === 'completed') {
    actions = `<div class="card" style="background:rgba(52,199,89,0.12);border:1px solid rgba(52,199,89,0.25);">
      <div style="font-size:13px;color:var(--hint);font-weight:600;">💰 К выплате</div>
      <div style="font-size:22px;font-weight:800;margin-top:4px;">${fmtMoneyFull(t.amount)}</div>
      <div style="font-size:12px;color:var(--hint);margin-top:6px;">Ожидайте перевода на кошелёк</div>
    </div>`;
  }
  if (isAdmin(uid) && t.status === 'pending_verification') {
    actions += `<div class="card" style="background:rgba(255,149,0,0.1);border:1px solid rgba(255,149,0,0.3);">
      <div style="font-size:13px;font-weight:700;margin-bottom:10px;">🔧 Действия администратора</div>
      <div class="btn-row">
        <button class="btn btn-success" onclick="adminConfirmPayment('${tradeId}')">✅ Принять</button>
        <button class="btn btn-danger" onclick="adminRejectPayment('${tradeId}')">❌ Отклонить</button>
      </div>
    </div>`;
  }

  return `
    <div class="topbar">
      <button class="back-btn" onclick="go('main')">←</button>
      <div style="flex:1;"><div class="title">${tradeId}</div><div style="font-size:12px;color:var(--hint);margin-top:2px;">${fmtDate(t.created_at)}</div></div>
      <span class="pill ${sClass}">${sIcon} ${sLabel}</span>
    </div>

    <div class="balance-card" style="background:linear-gradient(135deg, #2d3561 0%, #4a5a96 100%);margin-bottom:12px;">
      <div class="balance-label">Сумма сделки</div>
      <div class="balance-value">${fmtMoney(t.amount)}<small> ₽</small></div>
    </div>

    <div class="card">
      <div style="font-size:12px;color:var(--hint);font-weight:700;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:8px;">🎨 NFT</div>
      <div style="font-size:15px;font-weight:600;word-break:break-word;">${esc(t.nft_link)}</div>
    </div>

      <div class="item-row">
        <span class="item-label">👤 Продавец</span>
        <span class="item-value">@${esc(t.seller_username)} <span style="color:var(--gold);">⭐${(sellerStats.average_rating || 0).toFixed(1)}</span></span>
      </div>
      ${t.buyer_username ? `<div class="item-row">
        <span class="item-label">👤 Покупатель</span>
        <span class="item-value">@${esc(t.buyer_username)}</span>
      </div>` : ''}
      <div class="item-row">
        <span class="item-label">🛡️ Гарант</span>
        <span class="item-value" style="color:var(--success);">Защищено</span>
      </div>
    </div>

    ${actions}
  `;
}

function joinAsBuyer(tradeId) {
  const t = STATE.data.trades[tradeId];
  if (!t || t.status !== 'waiting_buyer') return toast('❌ Сделка недоступна');
  t.buyer_id = getUserId();
  t.buyer_username = getUserName();
  t.status = 'waiting_payment';
  saveData();
  toast('✅ Вы присоединились');
  render();
}
function markPaid(tradeId) {
  const t = STATE.data.trades[tradeId];
  t.status = 'pending_verification';
  saveData();
  toast('⏳ Оплата на проверке');
  render();
}
function cancelTrade(tradeId) {
  const t = STATE.data.trades[tradeId];
  t.status = 'cancelled';
  saveData();
  toast('❌ Сделка отменена');
  render();
}
function markNftSent(tradeId) {
  const t = STATE.data.trades[tradeId];
  t.status = 'nft_sent';
  saveData();
  toast('📦 Отправлено');
  render();
}
function markNftReceived(tradeId) {
  const t = STATE.data.trades[tradeId];
  t.status = 'completed';
  ensureUserStats(t.seller_id);
  STATE.data.userStats[t.seller_id].completed_trades++;
  addPendingRating(t.buyer_id, tradeId, t.seller_id, t.seller_username);
  addPendingRating(t.seller_id, tradeId, t.buyer_id, t.buyer_username);
  saveData();
  toast('🎉 Сделка завершена!');
  setTimeout(() => go('main'), 800);
}

function addPendingRating(raterId, tradeId, targetId, targetUsername) {
  if (!STATE.data.pendingRatings[raterId]) STATE.data.pendingRatings[raterId] = [];
  STATE.data.pendingRatings[raterId].push({ tradeId, targetId, targetUsername });
}

function adminConfirmPayment(tradeId) {
  const t = STATE.data.trades[tradeId];
  t.status = 'payment_confirmed';
  saveData();
  toast('✅ Оплата подтверждена');
  render();
}
function adminRejectPayment(tradeId) {
  const t = STATE.data.trades[tradeId];
  t.status = 'payment_rejected';
  saveData();

  `;

function startAddWallet(type) {
  const prompts = {
    card: ['💳 Номер карты', '0000 0000 0000 0000', 'tel'],
    sbp: ['📱 Телефон для СБП', '+7 900 000 00 00', 'tel'],
    yoomoney: ['💰 Номер кошелька ЮMoney', '4100112345678', 'text'],
    qiwi: ['🧾 Номер кошелька Qiwi', '+7 900 000 00 00', 'tel']
  };
  const p = prompts[type];
  openModal(`
    <h3>${p[0]}</h3>
    <div class="field">
      <label>Реквизиты</label>
      <input id="wallet-details" class="input" type="${p[2]}" placeholder="${p[1]}" autofocus>
    </div>
    <button class="btn btn-primary" onclick="saveWallet('${type}')">💾 Сохранить</button>
  `);
}

function saveWallet(type) {
  const raw = document.getElementById('wallet-details').value.trim();
  if (!raw) return toast('❌ Введите реквизиты');
  let details = raw;
  if (type === 'card') {
    const clean = raw.replace(/\s+/g, '');
    if (!/^\d{16,19}$/.test(clean)) return toast('❌ Неверный номер карты');
    details = clean.match(/.{1,4}/g).join(' ');
  } else if (type === 'sbp' || type === 'qiwi') {
    const clean = raw.replace(/\D/g, '');
    if (clean.length < 10 || clean.length > 11) return toast('❌ Неверный номер');
    details = (clean.length === 10 ? '+7' : '+') + clean;
  }
  const uid = getUserId();
  if (!STATE.data.userWallets[uid]) STATE.data.userWallets[uid] = {};
  STATE.data.userWallets[uid][type] = { details, added: nowISO() };
  saveData();
  closeModal();
  toast('✅ Кошелёк добавлен');
  render();
}

function deleteWallet(type) {
  const uid = getUserId();
  if (STATE.data.userWallets[uid]?.[type]) {
    delete STATE.data.userWallets[uid][type];
    saveData();
    toast('🗑️ Кошелёк удалён');
    render();
  }
}

        </div>
        <button class="btn btn-primary" onclick="submitRating(${i})">Отправить</button>
      </div>
    `).join('')}

const ratingTemp = {};
function setRating(idx, n) {
  ratingTemp[idx] = n;
  document.getElementById('rating-' + idx).querySelectorAll('button').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.star) <= n);
  });
}
function submitRating(idx) {
  if (!ratingTemp[idx]) return toast('❌ Выберите оценку');
  const uid = getUserId();
  const r = STATE.data.pendingRatings[uid][idx];
  ensureUserStats(r.targetId);
  const s = STATE.data.userStats[r.targetId];
  s.total_rating += ratingTemp[idx];
  s.rating_count++;
  s.average_rating = Math.round((s.total_rating / s.rating_count) * 100) / 100;
  STATE.data.pendingRatings[uid].splice(idx, 1);
  if (!STATE.data.pendingRatings[uid].length) delete STATE.data.pendingRatings[uid];
  saveData();
  delete ratingTemp[idx];
  toast('⭐ Спасибо за оценку!');
  go('main');
}

  document.getElementById('app').innerHTML = fn();
  // Sync bottom nav active state
  const tabMap = { 'main': 'main', 'my-trades': 'trades', 'wallets': 'wallets', 'profile': 'profile' };
  if (tabMap[STATE.screen]) STATE.tab = tabMap[STATE.screen];
}

/* ============================================================
   INIT
   ============================================================ */
function init() {
  if (tg?.initDataUnsafe?.user) STATE.tgUser = tg.initDataUnsafe.user;
  loadData();
  const params = new URLSearchParams(location.search);
  const tradeParam = params.get('trade');
  if (tradeParam && STATE.data.trades[tradeParam]) {
    go('trade-view', { tradeId: tradeParam });
  } else {
    go('main');
  }
}
init();
</script>
</body>

<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mrkt Parser</title>
    <!-- Подключаем SDK Telegram -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            /* Цвета берутся из темы Telegram автоматически */
            --bg-color: var(--tg-theme-bg-color, #ffffff);
            --text-color: var(--tg-theme-text-color, #000000);
            --hint-color: var(--tg-theme-hint-color, #999999);
            --secondary-bg-color: var(--tg-theme-secondary-bg-color, #f1f1f1);
            --button-color: var(--tg-theme-button-color, #3390ec);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --accent-color: #ff9500;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            /* Отступ снизу, чтобы нативная кнопка не перекрывала контент */
            padding-bottom: 90px; 
            transition: background-color 0.3s ease;
        }

        /* Шапка с приветствием */
        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 8px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background-color: var(--button-color);
            color: var(--button-text-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
        }

        .greeting h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .greeting p {
            font-size: 14px;
            color: var(--hint-color);
        }

        /* Карточки для инпутов */
        .card {
            background-color: var(--secondary-bg-color);
            border-radius: 14px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .card label {
            font-size: 13px;
            font-weight: 600;
            color: var(--hint-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .card input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-color);
            font-size: 17px;
            width: 100%;
        }

        .card input::placeholder {
            color: var(--hint-color);
            opacity: 0.6;
        }

        /* Блок с преимуществами */
        .features {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
        }

        .feature-icon {
            font-size: 20px;
        }

        /* Анимация появления */
        .fade-in {
            animation: fadeIn 0.4s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>

    <div class="header fade-in" style="animation-delay: 0.1s;">
        <div class="avatar" id="user-avatar">?</div>
        <div class="greeting">
            <h1 id="user-name">Привет!</h1>
            <p>Добро пожаловать в Mrkt Parser</p>
        </div>
    </div>

    <div class="card fade-in" style="animation-delay: 0.2s;">
        <label for="url-input">Ссылка на товар</label>
        <input type="url" id="url-input" placeholder="https://ozon.ru/product/..." autocomplete="off">
    </div>

    <div class="card fade-in" style="animation-delay: 0.3s;">
        <label for="price-input">Желаемая цена (₽)</label>
        <input type="number" id="price-input" placeholder="Например: 1500" autocomplete="off">
    </div>

    <div class="features fade-in" style="animation-delay: 0.4s;">
        <div class="feature-item">
            <span class="feature-icon">🔔</span>
            <span>Уведомим, когда цена упадет</span>
        </div>
        <div class="feature-item">
            <span class="feature-icon">⚡️</span>
            <span>Проверка каждые 15 минут</span>
        </div>
    </div>

    <script>
        // Инициализация Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем на весь экран

        // Настраиваем цвета шапки под тему
        tg.setHeaderColor('bg_color');
        tg.setBackgroundColor('bg_color');

        // Получаем данные пользователя
        const user = tg.initDataUnsafe?.user;
        if (user) {
            document.getElementById('user-name').textContent = `Привет, ${user.first_name}!`;
            document.getElementById('user-avatar').textContent = user.first_name.charAt(0).toUpperCase();
        }

        // --- Настройка нативной кнопки (MainButton) ---
        const mainButton = tg.MainButton;
        mainButton.setText("СОЗДАТЬ ОТСЛЕЖИВАНИЕ");
        mainButton.show();

        // Обработка нажатия на нативную кнопку
        mainButton.onClick(() => {
            const url = document.getElementById('url-input').value.trim();
            const price = document.getElementById('price-input').value.trim();

            // Валидация
            if (!url) {
                tg.showAlert("Пожалуйста, вставьте ссылку на товар.");
                tg.HapticFeedback.notificationOccurred('error');
                return;
            }

            if (!price || isNaN(price) || price <= 0) {
                tg.showAlert("Пожалуйста, укажите корректную цену.");
                tg.HapticFeedback.notificationOccurred('error');
                return;
            }

            // Вибро-отклик (успех)
            tg.HapticFeedback.notificationOccurred('success');
            
            // Блокируем кнопку от двойного нажатия
            mainButton.disable();
            mainButton.showProgress();

            // Формируем данные для отправки в Python-бота
            const data = {
                action: "add_track",
                url: url,
                target_price: Number(price)
            };

            // Отправляем данные боту и закрываем WebApp
            tg.sendData(JSON.stringify(data));
            tg.close();
        });

        // Убираем прогресс-бар и включаем кнопку, если пользователь вернулся в приложение
        tg.onEvent('viewportChanged', () => {
            if (mainButton.isProgressVisible) {
                mainButton.hideProgress();
                mainButton.enable();
            }
        });
    </script>
</body>
</html>

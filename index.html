<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TG Username Hunter</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0a0a0a;
            --surface: #141414;
            --primary: #00ff88; /* Неоновый зеленый */
            --text: #ffffff;
            --text-muted: #888888;
            --border: #2a2a2a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Courier New', Courier, monospace; /* Хакерский шрифт */
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 10px;
        }

        .header h1 {
            color: var(--primary);
            font-size: 22px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(0, 255, 136, 0.5);
        }

        .header p {
            color: var(--text-muted);
            font-size: 12px;
            margin-top: 5px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--surface);
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 12px;
        }

        input, select {
            background: #000;
            border: 1px solid var(--border);
            color: var(--primary);
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            outline: none;
            font-family: inherit;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.2);
        }

        .gen-btn {
            background: var(--primary);
            color: #000;
            border: none;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
        }

        .gen-btn:active {
            transform: scale(0.98);
            background: #00cc6a;
        }

        .results-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .result-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--surface);
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid var(--primary);
            animation: slideIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateX(-10px);
        }

        .username {
            font-size: 18px;
            color: #fff;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            background: #222;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-family: sans-serif;
        }

        .action-btn:hover {
            background: #333;
        }

        .action-btn.check {
            border-color: var(--primary);
            color: var(--primary);
        }

        @keyframes slideIn {
            to { opacity: 1; transform: translateX(0); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>[ Username_Hunter ]</h1>
        <p>Генератор редких и свободных ников</p>
    </div>

    <div class="input-group">
        <input type="text" id="base-word" placeholder="Введите слово (напр. crypto)" maxlength="15">
        <select id="style-select">
            <option value="short">Короткие (3-4 символа)</option>
            <option value="aesthetic">Эстетичные (с _)</option>
            <option value="leet">Leet-стиль (cryp70)</option>
            <option value="prefix">С приставкой (the_crypto)</option>
        </select>
        <button class="gen-btn" onclick="generateUsernames()">Сгенерировать</button>
    </div>

    <div class="results-container" id="results">
        <!-- Сюда будут падать результаты -->
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0a0a0a');
        tg.setBackgroundColor('#0a0a0a');

        const charMap = { 'a': '4', 'e': '3', 'i': '1', 'o': '0', 's': '5', 't': '7' };
        const prefixes = ['the', 'mr', 'real', '0x', 'im'];
        const suffixes = ['hq', 'vip', 'x', 'eth', 'dao'];

        function generateUsernames() {
            const base = document.getElementById('base-word').value.trim().toLowerCase();
            const style = document.getElementById('style-select').value;
            const resultsDiv = document.getElementById('results');
            
            if (!base) {
                tg.showAlert("Введите слово!");
                return;
            }

            tg.HapticFeedback.impactOccurred('medium');
            resultsDiv.innerHTML = ''; // Очищаем старое

            let generated = new Set();

            while (generated.size < 6) {
                let name = '';
                let randomSuffix = suffixes[Math.floor(Math.random() * suffixes.length)];
                let randomPrefix = prefixes[Math.floor(Math.random() * prefixes.length)];

                switch(style) {
                    case 'short':
                        // Берем часть слова и добавляем 1 символ
                        name = base.substring(0, 3) + randomSuffix.charAt(0);
                        break;
                    case 'aesthetic':
                        name = `_${base}_`;
                        break;
                    case 'leet':
                        name = base.split('').map(c => charMap[c] || c).join('');
                        break;
                    case 'prefix':
                        name = `${randomPrefix}_${base}`;
                        break;
                }
                generated.add(name);
            }

            // Отрисовываем результаты
            Array.from(generated).forEach((username, index) => {
                const item = document.createElement('div');
                item.className = 'result-item';
                item.style.animationDelay = `${index * 0.1}s`;
                
                item.innerHTML = `
                    <span class="username">@${username}</span>
                    <div class="actions">
                        <button class="action-btn" onclick="copyToClipboard('${username}')">Копировать</button>
                        <button class="action-btn check" onclick="checkUsername('${username}')">Проверить</button>
                    </div>
                `;
                resultsDiv.appendChild(item);
            });
        }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                tg.HapticFeedback.notificationOccurred('success');
                tg.showAlert(`@${text} скопирован!`);
            });
        }

        function checkUsername(username) {
            tg.HapticFeedback.impactOccurred('light');
            // Отправляем данные в бота для проверки
            tg.sendData(JSON.stringify({
                action: "check_username",
                username: username
            }));
            tg.showAlert(`Запрос на проверку @${username} отправлен в бота. Проверьте чат!`);
        }
    </script>
</body>
</html>

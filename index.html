<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NFT Mystery Box</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg: #0f0f13;
            --text: #ffffff;
            --accent: #8a2be2;
            --accent-glow: rgba(138, 43, 226, 0.6);
            --card-bg: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            /* Делаем фон с градиентными пятнами */
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(138, 43, 226, 0.15), transparent 40%),
                radial-gradient(circle at 85% 30%, rgba(0, 255, 255, 0.1), transparent 40%);
        }

        .header {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            z-index: 10;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, #00ffff, #8a2be2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
        }

        /* Контейнер для лутбокса */
        .box-container {
            position: relative;
            width: 240px;
            height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 40px;
        }

        /* Свечение вокруг бокса */
        .glow {
            position: absolute;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: var(--accent);
            filter: blur(60px);
            opacity: 0.5;
            animation: pulseGlow 3s infinite alternate;
        }

        /* Сам бокс */
        .nft-box {
            width: 180px;
            height: 180px;
            background: linear-gradient(135deg, #2b2b36, #15151a);
            border: 2px solid var(--border);
            border-radius: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 80px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
            z-index: 2;
            transition: transform 0.2s;
            position: relative;
            overflow: hidden;
        }

        /* Блик на боксе */
        .nft-box::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            animation: shine 4s infinite;
        }

        /* Анимация встряски */
        .shaking {
            animation: shake 0.5s infinite;
        }

        /* Результат */
        .result-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 15, 19, 0.95);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
            z-index: 100;
        }

        .result-screen.active {
            opacity: 1;
            pointer-events: auto;
        }

        .result-card {
            width: 280px;
            padding: 20px;
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 24px;
            text-align: center;
            transform: scale(0.8);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .result-screen.active .result-card {
            transform: scale(1);
        }

        .nft-image {
            font-size: 100px;
            margin-bottom: 15px;
            filter: drop-shadow(0 0 20px var(--accent));
        }

        .nft-name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .nft-rarity {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: var(--accent);
            margin-bottom: 20px;
        }

        /* Стили для редкостей */
        .rarity-common { color: #a0a0a0; --accent: #a0a0a0; }
        .rarity-rare { color: #00bfff; --accent: #00bfff; }
        .rarity-legendary { color: #ffd700; --accent: #ffd700; }

        @keyframes pulseGlow {
            0% { transform: scale(0.9); opacity: 0.4; }
            100% { transform: scale(1.1); opacity: 0.7; }
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>NFT Lootbox</h1>
    </div>

    <div class="box-container">
        <div class="glow" id="box-glow"></div>
        <div class="nft-box" id="main-box">📦</div>
    </div>

    <!-- Экран с результатом -->
    <div class="result-screen" id="result-screen">
        <div class="result-card" id="result-card">
            <div class="nft-image" id="res-image">💎</div>
            <div class="nft-name" id="res-name">Алмаз</div>
            <div class="nft-rarity" id="res-rarity">LEGENDARY</div>
            <button onclick="resetApp()" style="background: var(--accent); color: #fff; border: none; padding: 12px 24px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%;">Забрать и продолжить</button>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();
        tg.setHeaderColor('#0f0f13');
        tg.setBackgroundColor('#0f0f13');

        // Данные для рандомайзера
        const nfts = [
            { name: "Бронзовый Кот", icon: "🐱", rarity: "Common", class: "rarity-common", chance: 0.6 },
            { name: "Кибер-Панк", icon: "🤖", rarity: "Rare", class: "rarity-rare", chance: 0.3 },
            { name: "Золотой Кристалл", icon: "💎", rarity: "Legendary", class: "rarity-legendary", chance: 0.1 }
        ];

        const mainButton = tg.MainButton;
        mainButton.setText("ОТКРЫТЬ БОКС");
        mainButton.show();

        mainButton.onClick(() => {
            openBox();
        });

        function openBox() {
            mainButton.hide();
            tg.HapticFeedback.impactOccurred('heavy');
            
            const box = document.getElementById('main-box');
            box.classList.add('shaking');
            box.innerHTML = "⏳";

            // Имитация загрузки
            setTimeout(() => {
                box.classList.remove('shaking');
                
                // Выбираем случайный NFT
                const rand = Math.random();
                let currentChance = 0;
                let selectedNft = nfts[0];

                for (let nft of nfts) {
                    currentChance += nft.chance;
                    if (rand <= currentChance) {
                        selectedNft = nft;
                        break;
                    }
                }

                showResult(selectedNft);
            }, 1500); // Ждем 1.5 секунды
        }

        function showResult(nft) {
            tg.HapticFeedback.notificationOccurred('success');

            // Настраиваем карточку
            const screen = document.getElementById('result-screen');
            const card = document.getElementById('result-card');
            
            document.getElementById('res-image').textContent = nft.icon;
            document.getElementById('res-name').textContent = nft.name;
            
            const rarityEl = document.getElementById('res-rarity');
            rarityEl.textContent = nft.rarity;
            rarityEl.className = `nft-rarity ${nft.class}`;

            // Применяем цвет свечения к карточке
            card.style.boxShadow = `0 0 40px ${nft.class === 'rarity-common' ? '#a0a0a0' : nft.class === 'rarity-rare' ? '#00bfff' : '#ffd700'}`;

            screen.classList.add('active');

            // Отправляем данные боту в фоне (не закрывая приложение)
            tg.sendData(JSON.stringify({
                action: "mint_nft",
                nft_name: nft.name,
                rarity: nft.rarity
            }));
        }

        function resetApp() {
            document.getElementById('result-screen').classList.remove('active');
            const box = document.getElementById('main-box');
            box.innerHTML = "📦";
            mainButton.show();
            tg.HapticFeedback.impactOccurred('light');
        }
    </script>
</body>
</html>
